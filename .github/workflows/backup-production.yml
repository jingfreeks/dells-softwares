name: Backup production database

# BIR Compliance Audit, Phase 5: real, scheduled backups of the
# production tindahan-pos database, replacing the previous ad hoc manual
# `pg_dump` runs (see supabase/backups/ — gitignored, never had a script
# behind it).
#
# Requires these repo secrets. Deliberately NOT the existing
# TINDAHAN_SUPABASE_URL/TINDAHAN_SUPABASE_SERVICE_ROLE_KEY -- despite the
# name, tindahan-pos-ci.yml's own header comment documents those as
# STAGING credentials (used for e2e tests). Reusing them here was tried
# first and confirmed the hard way: the dump itself was really
# production's data (via TINDAHAN_PROD_SUPABASE_DB_URL below), but it
# uploaded into staging's `backups` bucket instead of production's, since
# the Storage client was built from staging's URL/key.
#
#   TINDAHAN_PROD_SUPABASE_URL              production project REST URL
#   TINDAHAN_PROD_SUPABASE_SERVICE_ROLE_KEY production service_role key --
#     used only here, server-side, to upload into the backups Storage
#     bucket (which has no client-facing RLS policy at all)
#   TINDAHAN_SUPABASE_DB_URL                production's Postgres
#     connection string -- NOT obtainable via `supabase projects
#     api-keys`; pull it from the Supabase dashboard's Connection string
#     page for the production project. Use the SESSION POOLER string
#     specifically (not "Direct connection" -- that hostname is IPv6-only
#     and unreachable from GitHub's runners; not "Transaction pooler" --
#     that mode doesn't support the session-level features pg_dump/
#     pg_dumpall need). Add it here manually as a repo secret.

on:
  schedule:
    # 19:00 UTC daily -- off the top of the hour and outside GitHub's
    # documented peak scheduling window (00:00 UTC), so this isn't queued
    # behind a pile of other repos' midnight-triggered jobs.
    - cron: "0 19 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    name: Dump and upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ubuntu's default `postgresql-client` package tracks an older major
      # version (16 as of this writing) than the production database (17),
      # and pg_dump refuses to dump from a newer server than itself. Pull
      # the matching major version from the official PGDG apt repo instead.
      - name: Install PostgreSQL client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          # ubuntu-latest ships a preinstalled v16 pg_dump directly on PATH
          # (not managed through postgresql-common's version-selection
          # wrapper) -- installing v17 alongside it does not repoint
          # /usr/bin/pg_dump, confirmed the hard way. Put v17's own bin
          # directory ahead of it explicitly.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Confirm pg_dump is the right version
        run: pg_dump --version

      - name: Install dependencies
        run: npm ci

      - name: Run backup
        run: node scripts/backup-database.mjs
        env:
          DATABASE_URL: ${{ secrets.TINDAHAN_SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.TINDAHAN_PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TINDAHAN_PROD_SUPABASE_SERVICE_ROLE_KEY }}
